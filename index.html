<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Askly</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <main class="search-area">
                <div class="search-container">
                    <div class="search-input-wrap">
                        <input type="text" id="searchInput" class="search-input" placeholder="Поиск по ключевым словам…" />
                        <button type="button" class="search-clear" id="searchClearBtn" aria-label="Очистить поиск">&times;</button>
                    </div>
                    <div class="search-meta"><span id="counterText">Загрузка вопросов…</span> <span id="searchStatus"></span></div>
                </div>
                <div id="qaList"></div>
                <div id="noResults" class="no-results hidden">Ничего не найдено. Попробуй изменить запрос.</div>
            </main>
        </div>
        <button class="feedback-fab" id="openModalBtn">Контакты</button>
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-window">
                <button class="modal-close" id="closeModalBtn">×</button>
                <div class="modal-header">Контакты</div>
                <div class="modal-desc">Мои каналы и страницы — пишите.</div>
                <div class="social-links">
                    <a href="https://t.me/kageno_x" target="_blank" class="social-btn">Telegram</a>
                    <a href="https://vk.com/kageno_gg" target="_blank" class="social-btn">ВКонтакте</a>
                    <a href="https://boosty.to/kageno_gg" target="_blank" class="social-btn">Boosty</a>
                    <a href="https://github.com/kageno-x" target="_blank" class="social-btn">GitHub</a>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
